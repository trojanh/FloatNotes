name: Release on Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Build and Package FloatNotes.app
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Archive FloatNotes.app to ZIP
        run: |
          cd build
          zip -r -9 FloatNotes.zip FloatNotes.app
          cd ..

      - name: Generate Release Tag & Notes
        id: vars
        run: |
          VERSION=$(grep -A 1 'CFBundleShortVersionString' Resources/Info.plist | tail -n 1 | sed -E 's/.*<string>(.*)<\/string>.*/\1/' | tr -d ' ')
          if [ -z "$VERSION" ]; then
            VERSION="1.1.0"
          fi
          
          # Use run number as build suffix to ensure unique tags per release merge
          TAG_NAME="v${VERSION}-b${{ github.run_number }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "FloatNotes ${{ steps.vars.outputs.tag_name }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            build/FloatNotes.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
